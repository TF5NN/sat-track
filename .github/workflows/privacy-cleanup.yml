name: Protect commit email privacy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protect-email:
    if: github.repository == 'TF5NN/sat-track' && github.actor == 'TF5NN' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Replace personal commit emails with the GitHub no-reply address
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, subprocess

          def git(*args, data=None):
              return subprocess.check_output(['git', *args], input=data)

          head = git('rev-parse', 'HEAD').decode().strip()
          approved_base = '9bedca6c41b55a8caf3983c51f247b3100f8ef73'
          if git('rev-parse', 'HEAD^').decode().strip() != approved_base:
              raise RuntimeError('Revision changed or cleanup already ran; refusing to rewrite history')
          if git('rev-list', '--count', head).decode().strip() != '4':
              raise RuntimeError('Unexpected history; refusing to rewrite history')
          expected_tree = git('rev-parse', 'HEAD^{tree}').strip()
          replacements = {}
          private_address = b'264675853+TF5NN@users.noreply.github.com'
          changed_identities = 0
          for old in git('rev-list', '--reverse', '--topo-order', head).decode().splitlines():
              raw = git('cat-file', 'commit', old)
              header, message = raw.split(b'\n\n', 1)
              lines = []
              skip_continuation = False
              for line in header.splitlines():
                  if line.startswith(b' '):
                      if not skip_continuation:
                          lines.append(line)
                      continue
                  skip_continuation = line.startswith((b'gpgsig ', b'gpgsig-sha256 ', b'mergetag '))
                  if skip_continuation:
                      continue
                  if line.startswith(b'parent '):
                      parent = line[7:].decode()
                      line = b'parent ' + replacements[parent].encode()
                  elif line.startswith((b'author ', b'committer ')):
                      match = re.fullmatch(rb'(author|committer) (.+) <([^>]*)>( .+)', line)
                      if not match:
                          raise RuntimeError('Unexpected commit identity format')
                      kind, name, email, suffix = match.groups()
                      if name == b'TF5NN' and email != private_address:
                          line = kind + b' ' + name + b' <' + private_address + b'>' + suffix
                          changed_identities += 1
                  lines.append(line)
              clean = b'\n'.join(lines) + b'\n\n' + message
              new = git('hash-object', '-t', 'commit', '-w', '--stdin', data=clean).decode().strip()
              assert git('rev-parse', new + '^{tree}') == git('rev-parse', old + '^{tree}')
              replacements[old] = new

          new_head = replacements[head]
          assert git('rev-parse', new_head + '^{tree}').strip() == expected_tree
          for line in git('log', new_head, '--format=%ae%n%ce').decode().splitlines():
              if not (line.endswith('@users.noreply.github.com') or line == 'noreply@github.com'):
                  raise RuntimeError('A non-private commit email remains')
          subprocess.run(['git', 'push', '--force-with-lease=refs/heads/main:' + head,
                          'origin', new_head + ':refs/heads/main'], check=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Replaced personal commit emails with the GitHub no-reply address.\n\n')
              summary.write('Verified every reachable commit identity and unchanged project files.\n')
          print(f'PASS: updated {changed_identities} commit identities; project files unchanged.')
          PY
